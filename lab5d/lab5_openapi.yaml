openapi: 3.0.3
info:
  title: Flights Demo REST API
  version: 1.0.0
  description: |
    Contract for lab D5 over the Postgres Pro Flights demo database.
    The API provides reference data access, route search, booking creation,
    and online check-in operations.

servers:
  - url: http://127.0.0.1:8000

tags:
  - name: Health
    description: Service health check
  - name: Cities
    description: Operations for city reference data
  - name: Airports
    description: Operations for airport reference data
  - name: Schedules
    description: Inbound and outbound airport schedules
  - name: Routes
    description: Route search operations
  - name: Bookings
    description: Booking creation
  - name: Check-ins
    description: Online check-in operations

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: health
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/cities:
    get:
      tags: [Cities]
      summary: Get list of cities
      operationId: getCities
      parameters:
        - name: role
          in: query
          required: false
          description: Which cities should be returned
          schema:
            $ref: '#/components/schemas/Role'
          example: both
      responses:
        '200':
          description: Cities returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityListResponse'
              examples:
                default:
                  value:
                    role: both
                    items:
                      - name: Ahmedabad
                      - name: Atlanta
                      - name: Mumbai
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/airports:
    get:
      tags: [Airports]
      summary: Get list of airports
      operationId: getAirports
      parameters:
        - name: role
          in: query
          required: false
          description: Which airports should be returned
          schema:
            $ref: '#/components/schemas/Role'
          example: source
      responses:
        '200':
          description: Airports returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AirportListResponse'
              examples:
                default:
                  value:
                    role: source
                    items:
                      - airport_code: AMD
                        airport_name: Sardar Vallabhbhai Patel
                        city: Ahmedabad
                        country: India
                        timezone: Asia/Kolkata
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/cities/{city}/airports:
    get:
      tags: [Cities, Airports]
      summary: Get airports of a specific city
      operationId: getAirportsInCity
      parameters:
        - name: city
          in: path
          required: true
          description: City name
          schema:
            type: string
          example: Moscow
      responses:
        '200':
          description: Airports of the specified city
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityAirportsResponse'
              examples:
                default:
                  value:
                    city: Moscow
                    items:
                      - airport_code: SVO
                        airport_name: Sheremetyevo
                        city: Moscow
                        country: Russia
                        timezone: Europe/Moscow
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/airports/{airport_code}/inbound-schedule:
    get:
      tags: [Schedules]
      summary: Get inbound schedule for airport
      operationId: getInboundSchedule
      parameters:
        - name: airport_code
          in: path
          required: true
          description: Airport code
          schema:
            type: string
          example: LED
      responses:
        '200':
          description: Inbound schedule returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AirportScheduleResponseInbound'
              examples:
                default:
                  value:
                    airport_code: LED
                    items:
                      - flight_no: PG0123
                        days_of_week: [1, 3, 5]
                        time_local: "14:25:00"
                        origin_airport: SVO
                        origin_city: Moscow
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/airports/{airport_code}/outbound-schedule:
    get:
      tags: [Schedules]
      summary: Get outbound schedule for airport
      operationId: getOutboundSchedule
      parameters:
        - name: airport_code
          in: path
          required: true
          description: Airport code
          schema:
            type: string
          example: SVO
      responses:
        '200':
          description: Outbound schedule returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AirportScheduleResponseOutbound'
              examples:
                default:
                  value:
                    airport_code: SVO
                    items:
                      - flight_no: PG0653
                        days_of_week: [1, 2, 3, 4, 5]
                        time_local: "01:05:00"
                        destination_airport: HGH
                        destination_city: Hangzhou
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/routes:
    get:
      tags: [Routes]
      summary: Search routes
      operationId: searchRoutes
      parameters:
        - name: origin_kind
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PointKind'
          example: airport
        - name: origin
          in: query
          required: true
          schema:
            type: string
          example: AMD
        - name: destination_kind
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PointKind'
          example: airport
        - name: destination
          in: query
          required: true
          schema:
            type: string
          example: BOM
        - name: departure_date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2025-12-01'
        - name: booking_class
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/FareConditions'
          example: Economy
        - name: max_connections
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MaxConnections'
          example: '0'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          example: 50
      responses:
        '200':
          description: Route search completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteSearchResponse'
              examples:
                default:
                  value:
                    query:
                      origin_kind: airport
                      origin: AMD
                      destination_kind: airport
                      destination: BOM
                      departure_date: '2025-12-01'
                      booking_class: Economy
                      max_connections: '0'
                      limit: 50
                    items:
                      - connections: 0
                        flight_ids: [11066]
                        flight_nos: [PG0055]
                        origin_airport: AMD
                        origin_city: Ahmedabad
                        destination_airport: BOM
                        destination_city: Mumbai
                        first_departure: '2025-12-01T09:15:00+07:00'
                        final_arrival: '2025-12-01T10:20:00+07:00'
                        route_free_seats: 56
                        segments:
                          - flight_id: 11066
                            flight_no: PG0055
                            departure_airport: AMD
                            departure_city: Ahmedabad
                            arrival_airport: BOM
                            arrival_city: Mumbai
                            scheduled_departure: '2025-12-01T09:15:00+07:00'
                            scheduled_arrival: '2025-12-01T10:20:00+07:00'
                            free_seats_in_class: 56
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/bookings:
    post:
      tags: [Bookings]
      summary: Create booking
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
            examples:
              default:
                value:
                  flight_ids: [11066]
                  fare_conditions: Economy
                  passenger_id: P1234567
                  passenger_name: Lilianna Test
      responses:
        '201':
          description: Booking created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
              examples:
                default:
                  value:
                    book_ref: 35DIGE
                    ticket_no: '6161195395371'
                    passenger_id: P1234567
                    passenger_name: Lilianna Test
                    fare_conditions: Economy
                    total_amount: '3250.00'
                    flight_ids: [11066]
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/check-ins:
    post:
      tags: [Check-ins]
      summary: Perform online check-in
      operationId: checkIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
            examples:
              default:
                value:
                  ticket_no: '6161195395371'
                  flight_id: 11066
      responses:
        '201':
          description: Check-in completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
              examples:
                default:
                  value:
                    ticket_no: '6161195395371'
                    flight_id: 11066
                    seat_no: 10A
                    boarding_no: 1
                    boarding_time: '2025-12-01T07:00:00+07:00'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  responses:
    NotFound:
      description: Requested entity was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: City 'Unknown' was not found

    Conflict:
      description: Conflict with current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: No seats left in class Economy for flight 11066

    UnprocessableEntity:
      description: Request is syntactically valid but violates business rules
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: Check-in is not open yet

  schemas:
    Role:
      type: string
      enum: [source, destination, both]

    PointKind:
      type: string
      enum: [airport, city]

    FareConditions:
      type: string
      enum: [Economy, Comfort, Business]

    MaxConnections:
      type: string
      enum: ['0', '1', '2', '3', unbound]

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    CityItem:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Ahmedabad

    CityListResponse:
      type: object
      required: [role, items]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CityItem'

    AirportItem:
      type: object
      required: [airport_code, airport_name, city, country, timezone]
      properties:
        airport_code:
          type: string
          example: AMD
        airport_name:
          type: string
          example: Sardar Vallabhbhai Patel
        city:
          type: string
          example: Ahmedabad
        country:
          type: string
          example: India
        timezone:
          type: string
          example: Asia/Kolkata

    AirportListResponse:
      type: object
      required: [role, items]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        items:
          type: array
          items:
            $ref: '#/components/schemas/AirportItem'

    CityAirportsResponse:
      type: object
      required: [city, items]
      properties:
        city:
          type: string
          example: Moscow
        items:
          type: array
          items:
            $ref: '#/components/schemas/AirportItem'

    InboundScheduleItem:
      type: object
      required: [flight_no, days_of_week, time_local, origin_airport, origin_city]
      properties:
        flight_no:
          type: string
          example: PG0123
        days_of_week:
          type: array
          items:
            type: integer
          example: [1, 3, 5]
        time_local:
          type: string
          format: time
          example: "14:25:00"
        origin_airport:
          type: string
          example: SVO
        origin_city:
          type: string
          example: Moscow

    OutboundScheduleItem:
      type: object
      required: [flight_no, days_of_week, time_local, destination_airport, destination_city]
      properties:
        flight_no:
          type: string
          example: PG0653
        days_of_week:
          type: array
          items:
            type: integer
          example: [1, 2, 3, 4, 5]
        time_local:
          type: string
          format: time
          example: "01:05:00"
        destination_airport:
          type: string
          example: HGH
        destination_city:
          type: string
          example: Hangzhou

    AirportScheduleResponseInbound:
      type: object
      required: [airport_code, items]
      properties:
        airport_code:
          type: string
          example: LED
        items:
          type: array
          items:
            $ref: '#/components/schemas/InboundScheduleItem'

    AirportScheduleResponseOutbound:
      type: object
      required: [airport_code, items]
      properties:
        airport_code:
          type: string
          example: SVO
        items:
          type: array
          items:
            $ref: '#/components/schemas/OutboundScheduleItem'

    RouteSegment:
      type: object
      required:
        - flight_id
        - flight_no
        - departure_airport
        - departure_city
        - arrival_airport
        - arrival_city
        - scheduled_departure
        - scheduled_arrival
        - free_seats_in_class
      properties:
        flight_id:
          type: integer
          example: 11066
        flight_no:
          type: string
          example: PG0055
        departure_airport:
          type: string
          example: AMD
        departure_city:
          type: string
          example: Ahmedabad
        arrival_airport:
          type: string
          example: BOM
        arrival_city:
          type: string
          example: Mumbai
        scheduled_departure:
          type: string
          format: date-time
          example: '2025-12-01T09:15:00+07:00'
        scheduled_arrival:
          type: string
          format: date-time
          example: '2025-12-01T10:20:00+07:00'
        free_seats_in_class:
          type: integer
          example: 56

    RouteOption:
      type: object
      required:
        - connections
        - flight_ids
        - flight_nos
        - origin_airport
        - origin_city
        - destination_airport
        - destination_city
        - first_departure
        - final_arrival
        - route_free_seats
        - segments
      properties:
        connections:
          type: integer
          example: 0
        flight_ids:
          type: array
          items:
            type: integer
          example: [11066]
        flight_nos:
          type: array
          items:
            type: string
          example: [PG0055]
        origin_airport:
          type: string
          example: AMD
        origin_city:
          type: string
          example: Ahmedabad
        destination_airport:
          type: string
          example: BOM
        destination_city:
          type: string
          example: Mumbai
        first_departure:
          type: string
          format: date-time
          example: '2025-12-01T09:15:00+07:00'
        final_arrival:
          type: string
          format: date-time
          example: '2025-12-01T10:20:00+07:00'
        route_free_seats:
          type: integer
          example: 56
        segments:
          type: array
          items:
            $ref: '#/components/schemas/RouteSegment'

    RouteSearchResponse:
      type: object
      required: [query, items]
      properties:
        query:
          type: object
          additionalProperties: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/RouteOption'

    CreateBookingRequest:
      type: object
      required: [flight_ids, fare_conditions, passenger_id, passenger_name]
      properties:
        flight_ids:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: integer
          example: [11066]
        fare_conditions:
          $ref: '#/components/schemas/FareConditions'
        passenger_id:
          type: string
          minLength: 3
          maxLength: 64
          example: P1234567
        passenger_name:
          type: string
          minLength: 3
          maxLength: 128
          example: Lilianna Test

    BookingResponse:
      type: object
      required:
        - book_ref
        - ticket_no
        - passenger_id
        - passenger_name
        - fare_conditions
        - total_amount
        - flight_ids
      properties:
        book_ref:
          type: string
          example: 35DIGE
        ticket_no:
          type: string
          example: '6161195395371'
        passenger_id:
          type: string
          example: P1234567
        passenger_name:
          type: string
          example: Lilianna Test
        fare_conditions:
          $ref: '#/components/schemas/FareConditions'
        total_amount:
          type: string
          example: '3250.00'
        flight_ids:
          type: array
          items:
            type: integer
          example: [11066]

    CheckInRequest:
      type: object
      required: [ticket_no, flight_id]
      properties:
        ticket_no:
          type: string
          minLength: 13
          maxLength: 13
          example: '6161195395371'
        flight_id:
          type: integer
          example: 11066
        preferred_seat:
          type: string
          maxLength: 4
          nullable: true
          example: 11A

    CheckInResponse:
      type: object
      required: [ticket_no, flight_id, seat_no, boarding_no, boarding_time]
      properties:
        ticket_no:
          type: string
          example: '6161195395371'
        flight_id:
          type: integer
          example: 11066
        seat_no:
          type: string
          example: 10A
        boarding_no:
          type: integer
          example: 1
        boarding_time:
          type: string
          format: date-time
          example: '2025-12-01T07:00:00+07:00'
